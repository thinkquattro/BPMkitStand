[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "standkit"
version = "0.6.1"
description = "Свободное ядро (MIT) для управления жизненным циклом локальных и удалённых стендов BPMSoft: headless start/stop/restart, health-пробы, логи, реестр стендов. Часть экосистемы BPMkit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "standkit contributors" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
]
# Ядро и агент — БЕЗ обязательных сторонних зависимостей (stdlib-only).
dependencies = []

[project.urls]
Homepage = "https://github.com/thinkquattro/BPMkitStand"
"Экосистема BPMkit" = "https://bpmkit.pro"

[project.optional-dependencies]
# Опциональный backend хранения секретов (standkit.secrets: set_secret/
# get_secret/has_secret/delete_secret) — ядро остаётся stdlib-only без него,
# просто SecretError на set_secret/delete_secret ("нет keyring").
secrets = ["keyring>=24"]
# Нативное окно вместо системного браузера для веб-дашборда (standkit_hub
# --desktop). Требует нативный вебдвижок ОС: WebView2 на Windows,
# WebKitGTK на Linux — сам pywebview его не тянет как pip-зависимость.
desktop = ["pywebview>=5"]
# Инструменты разработки/тестирования ядра, агента и хаба.
dev = ["pytest>=7.0"]

[project.scripts]
standkit-agent = "standkit_agent.__main__:main"
standkit-gui = "standkit_hub.__main__:main"
standkit-hub = "standkit_hub.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["standkit*", "standkit_agent*", "standkit_hub*"]

[tool.setuptools.package-data]
standkit_hub = ["assets/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
